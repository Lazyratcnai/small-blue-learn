<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小蓝学 - 魔法英语闯关</title>
    <style>
        /* 魔法学校风格 - 卡通可爱 */
        :root {
            --primary: #6B5BFF;
            --secondary: #FF6B9D;
            --accent: #FFD93D;
            --success: #4ECDC4;
            --danger: #FF6B6B;
            --dark: #2D3436;
            --light: #F8F9FA;
            --purple: #A29BFE;
            --pink: #FD79A8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .app {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 登录界面 */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #a777d3 100%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        
        @keyframes bgPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .title {
            color: white;
            font-size: 36px;
            font-weight: 900;
            margin-top: 20px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            margin-top: 10px;
        }
        
        .login-form {
            width: 100%;
            max-width: 320px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            outline: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-group input:focus {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .btn {
            width: 100%;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FFD93D 0%, #FF6B9D 100%);
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,107,157,0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.9);
            color: #6B5BFF;
            border: none;
        }
        
        .btn-secondary:hover {
            background: white;
            transform: translateY(-2px);
        }
        
        /* 用户选择界面 */
        .user-select {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .user-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 400px;
        }
        
        .user-card {
            width: 140px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .user-card:hover {
            transform: translateY(-5px) scale(1.05);
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .user-level {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .add-user {
            background: rgba(255,255,255,0.3);
            border: 3px dashed rgba(255,255,255,0.6);
            color: white;
        }
        
        .add-user:hover {
            background: rgba(255,255,255,0.4);
        }
        
        /* 主界面 */
        .main-screen {
            display: none;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 50%, #90EE90 100%);
        }
        
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.2);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar-small {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .user-name-small {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .content {
            padding: 20px;
            height: calc(100% - 100px);
            overflow-y: auto;
        }
        
        /* 关卡地图 */
        .map-container {
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 20px;
            min-height: 300px;
        }
        
        .map-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
        }
        
        .level-node {
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            border: 4px solid #ddd;
        }
        
        .level-node:hover {
            transform: scale(1.1);
        }
        
        .level-node.completed {
            border-color: var(--success);
            background: linear-gradient(135deg, #E8F8F5, #D5F5E3);
        }
        
        .level-node.current {
            border-color: var(--accent);
            background: linear-gradient(135deg, #FEF9E7, #FCF3CF);
            animation: pulse 1.5s infinite;
        }
        
        .level-node.locked {
            opacity: 0.5;
            border-color: #ccc;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,217,61,0.5); }
            50% { box-shadow: 0 0 0 15px rgba(255,217,61,0); }
        }
        
        .level-number {
            font-size: 18px;
            font-weight: 800;
            color: var(--dark);
        }
        
        .level-status {
            font-size: 10px;
            color: #888;
        }
        
        .level-name {
            font-size: 9px;
            color: #666;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 24px;
        }
        
        /* 响应式 */
        @media (min-width: 768px) {
            .login-form {
                max-width: 400px;
            }
            
            .level-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            
            .level-number {
                font-size: 24px;
            }
        }
        
        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading.active {
            display: flex;
        }
        
        /* 游戏界面 */
        .game-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        
        .game-header {
            padding: 15px 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .game-progress {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .progress-text {
            color: white;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ECDC4, #44CF6C);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .game-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            color: white;
            font-size: 16px;
        }
        
        .hp-display {
            color: #FF6B6B;
        }
        
        .question-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }
        
        .question-type {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .word-display {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .word-english {
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .word-chinese {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 15px;
        }
        
        .listen-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .listen-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.3);
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        
        .option-btn {
            background: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .option-btn:active {
            transform: scale(0.95);
        }
        
        .option-btn.correct {
            background: #4ECDC4;
            color: white;
        }
        
        .option-btn.wrong {
            background: #FF6B6B;
            color: white;
        }
        
        .match-area {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .match-words, .match-meanings {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .match-item {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
            text-align: center;
        }
        
        .match-item.selected {
            background: #6B5BFF;
            color: white;
        }
        
        .match-item.matched {
            background: #4ECDC4;
            color: white;
            opacity: 0.5;
        }
        
        .fill-area {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .fill-hint {
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .fill-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .game-footer {
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .game-timer {
            color: white;
            font-size: 18px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 2000;
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .toast.show {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        /* 页面内容区域 */
        .page-header {
            text-align: center;
            padding: 20px;
            color: white;
        }
        
        .page-header h2 {
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .page-desc {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* 错题本 */
        .wrong-list {
            padding: 0 15px;
        }
        
        .wrong-item {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .wrong-word {
            display: flex;
            flex-direction: column;
        }
        
        .wrong-en {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .wrong-cn {
            font-size: 14px;
            color: #666;
            margin-top: 3px;
        }
        
        .wrong-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .wrong-empty {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }
        
        .wrong-empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        /* 背包 */
        .bag-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 0 15px;
        }
        
        .bag-item {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .bag-item-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .bag-item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .bag-item-count {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .empty-state {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }
        
        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .empty-hint {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 10px;
        }
        
        /* 成就 */
        .achievement-list {
            padding: 0 15px;
        }
        
        .achievement-item {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .achievement-item.locked {
            opacity: 0.5;
        }
        
        .achievement-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #FFD93D, #FF6B9D);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .achievement-info {
            flex: 1;
        }
        
        .achievement-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .achievement-desc {
            font-size: 13px;
            color: #666;
            margin-top: 3px;
        }
        
        .achievement-status {
            font-size: 14px;
            color: var(--success);
        }
        
        .achievement-item.locked .achievement-status {
            color: #ccc;
        }
        
        /* 战斗系统 */
        .battle-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
        }
        
        .monster {
            text-align: center;
        }
        
        .monster-icon {
            font-size: 40px;
            display: block;
            animation: monsterFloat 2s ease-in-out infinite;
        }
        
        @keyframes monsterFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .monster-hp-bar {
            width: 80px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            margin: 5px auto;
            overflow: hidden;
        }
        
        .monster-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #FF8E53);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .monster-name {
            color: white;
            font-size: 12px;
        }
        
        .battle-effect {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            opacity: 0;
        }
        
        .battle-effect.attack {
            animation: attackAnim 0.5s ease-out;
        }
        
        .battle-effect.damage {
            animation: damageAnim 0.5s ease-out;
        }
        
        @keyframes attackAnim {
            0% { opacity: 1; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(2); }
        }
        
        @keyframes damageAnim {
            0% { opacity: 1; transform: translateX(0); }
            25% { opacity: 1; transform: translateX(-10px); }
            50% { opacity: 1; transform: translateX(10px); }
            75% { opacity: 1; transform: translateX(-10px); }
            100% { opacity: 0; transform: translateX(0); }
        }
        
        .monster.hit {
            animation: monsterHit 0.3s ease-out;
        }
        
        @keyframes monsterHit {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.8); filter: brightness(2); }
        }
        
        /* 魔法卡 */
        .magic-cards {
            display: flex;
            gap: 8px;
            margin: 0 15px;
        }
        
        .magic-card {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FFD93D, #FF6B9D);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;

        // 使用Web Audio API生成音效
        function playSoundEffect(type) {
            if (!soundEnabled) return;
            
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                switch(type) {
                    case 'correct':
                        // 正确 - 上升音调
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                        oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                        oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                        oscillator.start(audioCtx.currentTime);
                        oscillator.stop(audioCtx.currentTime + 0.3);
                        break;
                        
                    case 'wrong':
                        // 错误 - 下降音调
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                        oscillator.frequency.setValueAtTime(300, audioCtx.currentTime + 0.1);
                        oscillator.frequency.setValueAtTime(200, audioCtx.currentTime + 0.2);
                        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

                        oscillator.start(audioCtx.currentTime);
                        oscillator.stop(audioCtx.currentTime + 0.3);

                        oscillator.type = 'square';
                        oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);

        // ==================== 每周学习报告 ====================
        
        // 生成学习报告内容
        function generateWeeklyReport(user) {
            const now = new Date();
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            
            // 计算本周学习数据
            let wordsLearned = 0;
            let correctCount = 0;
            let wrongCount = 0;
            let levelsCompleted = 0;
            
            // 统计本周数据
            for (const levelId in user.levels) {
                const level = user.levels[levelId];
                if (level.completed && level.completedAt > weekAgo.getTime()) {
                    levelsCompleted++;
                    wordsLearned += level.wordsLearned || 0;
                    correctCount += level.correctCount || 0;
                    wrongCount += level.wrongCount || 0;
                }
            }
            
            const accuracy = wordsLearned > 0 ? Math.round((correctCount / wordsLearned) * 100) : 0;
            
            // 生成报告
            const report = `
📊 ${user.name} 的本周学习报告
━━━━━━━━━━━━━━━━━━━━━━━━━━

🌟 学习进度：
   • 通关关卡：${levelsCompleted} 个
   • 学习单词：${wordsLearned} 个
   • 正确率：${accuracy}%

📈 累计数据：
   • 总星星：${user.stars || 0} ⭐
   • 总钻石：${user.gems || 0} 💎
   • 错题本：${user.wrongWords?.length || 0} 题

💪 继续加油！下周见！🚀
            `.trim();
            
            return report;
        }

            // 生成本周报告

            // 显示报告内容
            alert(report + '\n\n📧 报告已生成！\n如需发送到家长邮箱，请配置邮件服务。');
            showToast('📊 报告已生成');

        // 检查并发送每周报告（自动调用）
        function checkAndSendWeeklyReport() {
            if (!gameState.currentUser) return;
            
            const user = gameState.users[gameState.currentUser];
            if (!user || !user.parentEmail) return;
            
            const now = new Date();
            const monday = getMonday(now);
            const reportKey = monday.toISOString().split('T')[0];
            
            // 如果本周还没发送过报告
            if (!user.weeklyReportSent || !user.weeklyReportSent.includes(reportKey)) {
                // 发送报告
                const report = generateWeeklyReport(user);
                console.log('发送每周报告:', report);
                
                // 记录已发送
                if (!user.weeklyReportSent) user.weeklyReportSent = [];
                user.weeklyReportSent.push(reportKey);
                saveData();
            }
        }
        
        // 获取本周一日期
        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        // 开始关卡
        function playLevel(level) {
            const user = gameState.users[gameState.currentUser];

            const reviewCount = Math.min(Math.floor(words.length * CONFIG.reviewRatio), wrongWords.length);
            
            // 随机选择一些错题混入
            if (reviewCount > 0) {
                const shuffledWrong = [...wrongWords].sort(() => Math.random() - 0.5);
                words = [...shuffledWrong.slice(0, reviewCount), ...words].slice(0, words.length + reviewCount);
            }
            
            // 打乱顺序
            words = shuffleArray([...words]);
            
            // 生成题目

            const monsterIndex = Math.floor(Math.random() * MONSTERS.length);

                questions: generateQuestions(words),
                currentIndex: 0,
                score: 0,
                hp: 3,
                startTime: Date.now(),

            showToast(`开始第 ${level} 关：${levelInfo?.name || ''}`);

        // 打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        // 生成题目
        function generateQuestions(words) {
            const questions = [];
            const numQuestions = Math.min(words.length, CONFIG.wordsPerLevel);
            
            // 题型数组（不包括连连看，因为它一次出多对）
            const simpleTypes = QUESTION_TYPES.filter(t => t.id !== 'match');
            
            for (let i = 0; i < numQuestions; i++) {
                const word = words[i];
                // 随机选择题型（包括所有简单题型）
                const type = simpleTypes[Math.floor(Math.random() * simpleTypes.length)];
                questions.push({
                    word: word,
                    type: type,
                    answered: false,
                    correct: false
                });
            }
            
            return questions;
        }

            document.getElementById('progressFill').style.width =

            // 根据题型生成选项
            if (q.type.id === 'en2cn') {

        // 生成填空提示
        function generateFillHint(word) {
            // 隐藏中间几个字母
            const len = word.length;
            if (len <= 3) return word;
            
            const hideCount = Math.max(1, Math.floor(len / 2));
            const indices = [];
            while (indices.length < hideCount) {
                const idx = Math.floor(Math.random() * len);
                if (!indices.includes(idx) && idx !== 0 && idx !== len - 1) {
                    indices.push(idx);
                }
            }
            
            let hint = '';
            for (let i = 0; i < len; i++) {
                hint += indices.includes(i) ? '_' : word[i];
            }
            return hint;
        }

                document.getElementById('monsterHpFill').style.width = hpPercent + '%';
                
                // 怪物受击动画

                // 检查是否击败怪物

                    playSoundEffect('victory');

                // 从错题本移除（如果之前有）

                const wrongIndex = user.wrongWords.findIndex(w => w.en === word.en);
                if (wrongIndex > -1) {

                if (!user.wrongWords) user.wrongWords = [];
                if (!user.wrongWords.find(w => w.en === word.en)) {
                    user.wrongWords.push(word);

            const wrongOptions = shuffleArray([...new Set(allWords)]).slice(0, 3);
            const options = shuffleArray([word.cn, ...wrongOptions]);
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === word.cn, word);
                grid.appendChild(btn);
            });
        }
        
        // 连连看 - 同时出现多个单词和中文，匹配配对
        function showMatchQuestion() {
            // 从当前关卡词汇中选取4对
            const user = gameState.users[gameState.currentUser];
            let words = getLevelWords ? getLevelWords(gameData.level) : [];
            
            // 如果词汇不够4对，从词库补充
            if (words.length < 4) {
                for (const key in WORDS) {
                    words = words.concat(WORDS[key]);
                }
            }
            
            // 随机选4对
            const selectedWords = shuffleArray([...words]).slice(0, 4);
            
            // 保存配对信息
            gameData.currentMatchPairs = selectedWords.map(w => ({ word: w, selected: null }));
            
            // 显示连连看区域
            document.getElementById('optionsGrid').style.display = 'none';
            document.getElementById('wordDisplay').style.display = 'none';
            document.getElementById('fillArea').style.display = 'none';
            document.getElementById('matchArea').style.display = 'flex';
            document.getElementById('questionType').textContent = '连连看 - 配对单词和中文';
            
            const wordsContainer = document.getElementById('matchWords');
            const meaningsContainer = document.getElementById('matchMeanings');
            wordsContainer.innerHTML = '';
            meaningsContainer.innerHTML = '';
            
            // 英文单词（打乱）
            const shuffledEn = shuffleArray([...selectedWords]);
            shuffledEn.forEach((w, idx) => {
                const item = document.createElement('div');
                item.className = 'match-item';
                item.textContent = w.en;
                item.dataset.index = selectedWords.indexOf(w);
                item.dataset.side = 'en';
                item.onclick = () => selectMatchItem(item, 'en', selectedWords.indexOf(w));
                wordsContainer.appendChild(item);
            });
            
            // 中文意思（打乱）
            const shuffledCn = shuffleArray([...selectedWords]);
            shuffledCn.forEach((w, idx) => {
                const item = document.createElement('div');
                item.className = 'match-item';
                item.textContent = w.cn;
                item.dataset.index = selectedWords.indexOf(w);
                item.dataset.side = 'cn';
                item.onclick = () => selectMatchItem(item, 'cn', selectedWords.indexOf(w));
                meaningsContainer.appendChild(item);
            });
            
            // 已匹配数
            gameData.matchedCount = 0;
            gameData.matchedPairs = [];
        }
        
        // 连连看选择
        function selectMatchItem(item, side, index) {
            if (item.classList.contains('matched')) return;
            
            // 如果已经选了一个
            const selectedEn = document.querySelector('.match-item.selected[data-side="en"]');
            const selectedCn = document.querySelector('.match-item.selected[data-side="cn"]');
            
            if (side === 'en' && selectedEn) {
                selectedEn.classList.remove('selected');
            }
            if (side === 'cn' && selectedCn) {
                selectedCn.classList.remove('selected');
            }
            
            item.classList.add('selected');
            item.dataset.side = side;
            
            // 如果两边都选了，检查是否匹配
            const newSelectedEn = document.querySelector('.match-item.selected[data-side="en"]');
            const newSelectedCn = document.querySelector('.match-item.selected[data-side="cn"]');
            
            if (newSelectedEn && newSelectedCn) {
                const enIndex = parseInt(newSelectedEn.dataset.index);
                const cnIndex = parseInt(newSelectedCn.dataset.index);
                
                if (enIndex === cnIndex) {
                    // 匹配成功
                    newSelectedEn.classList.remove('selected');
                    newSelectedCn.classList.remove('selected');
                    newSelectedEn.classList.add('matched');
                    newSelectedCn.classList.add('matched');
                    
                    gameData.matchedCount++;
                    showToast('配对成功！');
                    
                    // 检查是否完成所有配对
                    if (gameData.matchedCount >= 4) {
                        setTimeout(() => {
                            // 连连看全对算正确
                            checkAnswer(true, { en: 'match', cn: 'match' });
                        }, 500);
                    }
                } else {
                    // 匹配失败
                    setTimeout(() => {
                        newSelectedEn.classList.remove('selected');
                        newSelectedCn.classList.remove('selected');
                        showToast('配对错误，再试试');
                    }, 300);
                }
            }
        }
        
        // 计时器
        function startGameTimer() {
            gameData.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameData.startTime) / 1000);
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('gameTimer').textContent = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }
        
        // 结束游戏
        function endGame(victory = true) {
            clearInterval(gameData.timerInterval);
            
            const user = gameState.users[gameState.currentUser];
            const level = gameData.level;
            const score = gameData.score;
            
            // 计算星星
            const totalQuestions = gameData.questions.length;
            const correctCount = gameData.questions.filter(q => q.correct).length;
            const accuracy = correctCount / totalQuestions;
            
            let stars = 0;
            if (accuracy >= 0.9) stars = 3;
            else if (accuracy >= 0.7) stars = 2;
            else if (accuracy >= 0.5) stars = 1;
            
            // 保存关卡进度
            if (victory && stars > 0) {
                const levelData = user.levels[level] || { completed: false, stars: 0 };
                if (!levelData.completed || levelData.stars < stars) {
                    levelData.completed = true;
                    levelData.stars = stars;
                    user.levels[level] = levelData;
                    user.stars += stars;
                }
            }
            
            // 更新统计
            user.totalWords += correctCount;
            user.totalCorrect += correctCount;
            user.lastPlay = Date.now();
            
            saveData();
            
            // 自动同步到云端（如果启用）
            if (window.cloudSyncEnabled && gameState.currentUser) {
                uploadToCloud(gameState.currentUser);
            }
            
            // 显示结果
            const message = victory 
                ? `通关成功！获得 ${stars} ⭐` 
                : `游戏结束！答对 ${correctCount} 题`;
            
            showToast(message);
            
            // 延迟返回主界面
            setTimeout(() => {
                quitGame();
            }, 1500);
        }
        
        // 退出游戏
        function quitGame() {
            clearInterval(gameData.timerInterval);
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            renderLevels();
        }
        
        // ==================== 初始化 ====================
        
        // 初始化
        function init() {
            console.log('=== INIT START ===');
            console.log('GAME_LEVELS loaded, count:', GAME_LEVELS.length);
            loadData();
            
            // 检查是否有用户
            if (Object.keys(gameState.users).length > 0) {
                showUserSelect();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
            
            // 绑定开始游戏按钮
            const startBtn = document.getElementById('startGameBtn');
            if (startBtn) {
                startBtn.addEventListener('click', function() {
                    console.log('按钮被点击了！');
                    startGame();
                });
                console.log('开始按钮事件已绑定');
            }
            
            // 绑定底部导航点击事件
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    switchPage(page);
                });
            });
        }
        
        // 页面切换
        function switchPage(pageName) {
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageName);
            });
            
            // 隐藏所有页面
            document.querySelectorAll('.page-content').forEach(page => {
                page.style.display = 'none';
            });
            
            // 显示目标页面
            const pageMap = {
                'home': 'pageHome',
                'poetry': 'pagePoetry',
                'wrongbook': 'pageWrongBook',
                'bag': 'pageBag',
                'achievements': 'pageAchievements'
            };
            const targetPage = document.getElementById(pageMap[pageName]);
            if (targetPage) {
                targetPage.style.display = 'block';
            }
            
            // 渲染页面内容
            if (pageName === 'wrongbook') {
                renderWrongBook();
            } else if (pageName === 'bag') {
                renderBag();
            } else if (pageName === 'achievements') {
                renderAchievements();
            }
        }
        
        // 渲染错题本
        function renderWrongBook() {
            const user = gameState.users[gameState.currentUser];
            const wrongList = document.getElementById('wrongList');
            const wrongWords = user.wrongWords || [];
            
            if (wrongWords.length === 0) {
                wrongList.innerHTML = `
                    <div class="wrong-empty">
                        <div class="wrong-empty-icon">🎉</div>
                        <p>太棒了！没有错题</p>
                        <p>继续保持哦~</p>
                    </div>
                `;
                return;
            }
            
            wrongList.innerHTML = wrongWords.map((word, idx) => `
                <div class="wrong-item">
                    <div class="wrong-word">
                        <span class="wrong-en">${word.en}</span>
                        <span class="wrong-cn">${word.cn}</span>
                    </div>
                    <button class="wrong-btn" onclick="playWordSound('${word.en}')">🔊 朗读</button>
                </div>
            `).join('');
        }
        
        // 播放单词发音（错题本）
        function playWordSound(word) {
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-GB';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }
        
        // 使用魔法卡
        function useMagicCard(type) {
            const user = gameState.users[gameState.currentUser];
            const cards = user.magicCards || { hint: 0, shield: 0, attack: 0 };
            
            if (type === 'hint') {
                // 提示卡 - 显示当前题目的正确答案
                const currentQ = gameData.questions[gameData.currentIndex];
                if (currentQ) {
                    showToast('💡 提示：' + currentQ.word.cn);
                }
            } else if (type === 'shield') {
                // 护盾 - 本题答错不扣血
                gameData.shieldActive = true;
                showToast('🛡️ 护盾已激活，本题答错不扣血！');
            } else if (type === 'attack') {
                // 攻击卡 - 对怪物造成额外伤害
                const damage = 30;
                gameData.monsterHP = Math.max(0, gameData.monsterHP - damage);
                const hpPercent = (gameData.monsterHP / gameData.maxMonsterHP) * 100;
                document.getElementById('monsterHpFill').style.width = hpPercent + '%';
                showToast('⚔️ 使用攻击卡！对怪物造成30伤害');
                
                // 检查是否击败怪物
                if (gameData.monsterHP <= 0) {
                    showToast('🎉 击败怪物！获得奖励');
                    user.gems = (user.gems || 0) + 5;
                }
            }
            
            // 标记卡牌已使用
            saveData();
        }
        
        // 修改答错逻辑，护盾生效
        function checkAnswerWithShield(isCorrect, word) {
            // 如果有护盾且答错，不扣血
            if (!isCorrect && gameData.shieldActive) {
                gameData.shieldActive = false;
                showToast('🛡️ 护盾保护了你！');
                // 仍然加入错题本，但不扣血
                const user = gameState.users[gameState.currentUser];
                if (!user.wrongWords) user.wrongWords = [];
                if (!user.wrongWords.find(w => w.en === word.en)) {
                    user.wrongWords.push(word);
                }
                saveData();
                
                // 继续下一题
                setTimeout(() => {
                    gameData.currentIndex++;
                    showQuestion();
                }, 800);
                return true;
            }
            return false;
        }
        
        // 渲染背包
        function renderBag() {
            const user = gameState.users[gameState.currentUser];
            const bagGrid = document.getElementById('bagGrid');
            const bagEmpty = document.getElementById('bagEmpty');
            
            // 示例背包物品（后续可以添加更多）
            const items = [
                { id: 'gem_blue', name: '蓝宝石', icon: '💎', count: user.gems || 0 },
                { id: 'star', name: '星星', icon: '⭐', count: user.stars || 0 }
            ];
            
            const itemsWithCount = items.filter(item => item.count > 0);
            
            if (itemsWithCount.length === 0) {
                bagGrid.style.display = 'none';
                bagEmpty.style.display = 'block';
                return;
            }
            
            bagGrid.style.display = 'grid';
            bagEmpty.style.display = 'none';
            
            bagGrid.innerHTML = items.map(item => `
                <div class="bag-item">
                    <div class="bag-item-icon">${item.icon}</div>
                    <div class="bag-item-name">${item.name}</div>
                    <div class="bag-item-count">x${item.count}</div>
                </div>
            `).join('');
        }
        
        // 成就数据
        const ACHIEVEMENTS = [
            { id: 'first_level', name: '初出茅庐', desc: '完成第一个关卡', icon: '🌟', req: 1 },
            { id: 'ten_words', name: '单词达人', desc: '学习10个单词', icon: '📚', req: 10 },
            { id: 'hundred_words', name: '词汇大师', desc: '学习100个单词', icon: '🏅', req: 100 },
            { id: 'five_stars', name: '星级学员', desc: '累计获得5颗星', icon: '⭐', req: 5, type: 'stars' },
            { id: 'perfect', name: '完美通关', desc: '一次通关获得3星', icon: '💯', req: 1, type: 'perfect' },
            { id: 'no_wrong', name: '全对战神', desc: '一关全部答对', icon: '🔥', req: 1, type: 'nowrong' }
        ];
        
        // 渲染成就
        function renderAchievements() {
            const user = gameState.users[gameState.currentUser];
            const list = document.getElementById('achievementList');
            
            // 检查成就达成情况
            const userAchievements = user.achievements || [];
            const totalWords = user.totalWords || 0;
            const totalStars = user.stars || 0;
            
            list.innerHTML = ACHIEVEMENTS.map(ach => {
                let unlocked = false;
                
                if (ach.type === 'stars') {
                    unlocked = totalStars >= ach.req;
                } else if (ach.type === 'perfect') {
                    // 检查是否有任何关卡获得3星
                    unlocked = Object.values(user.levels || {}).some(l => l.stars === 3);
                } else if (ach.type === 'nowrong') {
                    // 检查是否有任何关卡全对（需要记录）
                    unlocked = userAchievements.includes(ach.id);
                } else {
                    unlocked = totalWords >= ach.req;
                }
                
                const isUnlocked = unlocked || userAchievements.includes(ach.id);
                
                return `
                    <div class="achievement-item ${isUnlocked ? '' : 'locked'}">
                        <div class="achievement-icon">${ach.icon}</div>
                        <div class="achievement-info">
                            <div class="achievement-name">${ach.name}</div>
                            <div class="achievement-desc">${ach.desc}</div>
                        </div>
                        <div class="achievement-status">${isUnlocked ? '✅ 已达成' : '🔒 未达成'}</div>
                    </div>
                `;
            }).join('');
        }
        
        // 注意：init() 现在由 waitForWords() 调用，不再使用 window.onload
    </script>
</body>
