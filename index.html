<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小蓝学 - 魔法英语闯关</title>
    <style>
        /* 魔法学校风格 - 卡通可爱 */
        :root {
            --primary: #6B5BFF;
            --secondary: #FF6B9D;
            --accent: #FFD93D;
            --success: #4ECDC4;
            --danger: #FF6B6B;
            --dark: #2D3436;
            --light: #F8F9FA;
            --purple: #A29BFE;
            --pink: #FD79A8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .app {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 登录界面 */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #a777d3 100%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        
        @keyframes bgPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .title {
            color: white;
            font-size: 36px;
            font-weight: 900;
            margin-top: 20px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            margin-top: 10px;
        }
        
        .login-form {
            width: 100%;
            max-width: 320px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            outline: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-group input:focus {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .btn {
            width: 100%;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FFD93D 0%, #FF6B9D 100%);
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,107,157,0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        /* 用户选择界面 */
        .user-select {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .user-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 400px;
        }
        
        .user-card {
            width: 140px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .user-card:hover {
            transform: translateY(-5px) scale(1.05);
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .user-level {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .add-user {
            background: rgba(255,255,255,0.3);
            border: 3px dashed rgba(255,255,255,0.6);
            color: white;
        }
        
        .add-user:hover {
            background: rgba(255,255,255,0.4);
        }
        
        /* 主界面 */
        .main-screen {
            display: none;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 50%, #90EE90 100%);
        }
        
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.2);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar-small {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .user-name-small {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .content {
            padding: 20px;
            height: calc(100% - 100px);
            overflow-y: auto;
        }
        
        /* 关卡地图 */
        .map-container {
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 20px;
            min-height: 300px;
        }
        
        .map-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
        }
        
        .level-node {
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            border: 4px solid #ddd;
        }
        
        .level-node:hover {
            transform: scale(1.1);
        }
        
        .level-node.completed {
            border-color: var(--success);
            background: linear-gradient(135deg, #E8F8F5, #D5F5E3);
        }
        
        .level-node.current {
            border-color: var(--accent);
            background: linear-gradient(135deg, #FEF9E7, #FCF3CF);
            animation: pulse 1.5s infinite;
        }
        
        .level-node.locked {
            opacity: 0.5;
            border-color: #ccc;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,217,61,0.5); }
            50% { box-shadow: 0 0 0 15px rgba(255,217,61,0); }
        }
        
        .level-number {
            font-size: 18px;
            font-weight: 800;
            color: var(--dark);
        }
        
        .level-status {
            font-size: 10px;
            color: #888;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 24px;
        }
        
        /* 响应式 */
        @media (min-width: 768px) {
            .login-form {
                max-width: 400px;
            }
            
            .level-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            
            .level-number {
                font-size: 24px;
            }
        }
        
        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading.active {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 2000;
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .toast.show {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 登录界面 -->
        <div class="login-screen" id="loginScreen">
            <div class="logo-container">
                <div class="logo">🧙</div>
                <h1 class="title">小蓝学</h1>
                <p class="subtitle">魔法英语闯关之旅</p>
            </div>
            <div class="login-form">
                <div class="input-group">
                    <label>请输入你的名字</label>
                    <input type="text" id="userName" placeholder="比如：Joe" maxlength="10">
                </div>
                <button class="btn btn-primary" onclick="startGame()">开始冒险 ✨</button>
            </div>
        </div>
        
        <!-- 用户选择 -->
        <div class="user-select" id="userSelect">
            <div class="logo-container">
                <div class="logo">🧙</div>
                <h1 class="title">小蓝学</h1>
                <p class="subtitle">选择你的角色</p>
            </div>
            <div class="user-list" id="userList">
                <!-- 用户列表 -->
            </div>
            <button class="btn btn-primary" style="margin-top: 30px; max-width: 200px;" onclick="showLogin()">+ 添加新角色</button>
        </div>
        
        <!-- 主界面 -->
        <div class="main-screen" id="mainScreen">
            <div class="header">
                <div class="user-info">
                    <div class="user-avatar-small" id="headerAvatar">🧙</div>
                    <span class="user-name-small" id="headerName">Joe</span>
                </div>
                <div class="stats">
                    <div class="stat-item">⭐ <span id="totalStars">0</span></div>
                    <div class="stat-item">💎 <span id="totalGems">0</span></div>
                </div>
            </div>
            
            <div class="content">
                <div class="map-container">
                    <div class="map-title">🌟 魔法关卡</div>
                    <div class="level-grid" id="levelGrid">
                        <!-- 关卡节点 -->
                    </div>
                </div>
            </div>
            
            <div class="bottom-nav">
                <div class="nav-item active">
                    <span class="nav-icon">🏠</span>
                    <span>主页</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">📚</span>
                    <span>错题本</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">🎒</span>
                    <span>背包</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">🏆</span>
                    <span>成就</span>
                </div>
            </div>
        </div>
        
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        
        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>
    
    <script>
        // ==================== 数据系统 ====================
        
        // 游戏数据存储key
        const STORAGE_KEY = 'smallblue_learn_data';
        
        // 游戏配置
        const CONFIG = {
            levelsPerWorld: 20,  // 每个大关的关卡数
            wordsPerLevel: 25,   // 每关单词数
            questionTypes: 5,   // 每关题型数
            reviewRatio: 0.2,   // 错题混入比例
            cosBucket: 'mario-1258221587',
            cosRegion: 'ap-shanghai',
            cosPath: 'small-blue-learn/users/'
        };
        
        // 题型定义
        const QUESTION_TYPES = [
            { id: 'en2cn', name: '看英文选中文', icon: '📝' },
            { id: 'cn2en', name: '看中文选英文', icon: '🔤' },
            { id: 'listen', name: '听力选择', icon: '🔊' },
            { id: 'match', name: '连连看', icon: '🔗' },
            { id: 'fill', name: '填空题', icon: '✏️' }
        ];
        
        // 游戏状态
        let gameState = {
            currentUser: null,
            users: {},
            currentLevel: 1
        };
        
        // ==================== 存储系统 ====================
        
        // 加载数据
        function loadData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    gameState = JSON.parse(data);
                }
            } catch (e) {
                console.error('加载数据失败:', e);
            }
        }
        
        // 保存数据
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
            } catch (e) {
                console.error('保存数据失败:', e);
            }
        }
        
        // 创建新用户
        function createUser(name) {
            const userId = 'user_' + Date.now();
            gameState.users[userId] = {
                id: userId,
                name: name,
                avatar: '🧙',
                createdAt: Date.now(),
                levels: {},           // 关卡进度
                wrongWords: [],       // 错题本
                stars: 0,             // 总星星
                gems: 0,              // 钻石
                achievements: [],    // 成就
                totalWords: 0,        // 学过的总词数
                totalCorrect: 0,      // 正确总数
                lastPlay: null        // 最后游玩时间
            };
            return gameState.users[userId];
        }
        
        // ==================== 界面系统 ====================
        
        // 显示Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // 显示Loading
        function showLoading(show = true) {
            document.getElementById('loading').classList.toggle('active', show);
        }
        
        // 开始游戏
        function startGame() {
            const nameInput = document.getElementById('userName');
            const name = nameInput.value.trim();
            
            if (!name) {
                showToast('请输入你的名字');
                return;
            }
            
            // 检查是否已存在用户
            let user = null;
            for (const id in gameState.users) {
                if (gameState.users[id].name === name) {
                    user = gameState.users[id];
                    break;
                }
            }
            
            // 创建新用户
            if (!user) {
                user = createUser(name);
            }
            
            gameState.currentUser = user.id;
            saveData();
            
            showMainScreen();
        }
        
        // 显示登录界面
        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('userSelect').style.display = 'none';
            document.getElementById('userName').value = '';
        }
        
        // 显示用户选择
        function showUserSelect() {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';
            
            for (const id in gameState.users) {
                const user = gameState.users[id];
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-avatar">${user.avatar}</div>
                    <div class="user-name">${user.name}</div>
                    <div class="user-level">Lv.${Math.floor(user.totalWords / 50) + 1}</div>
                `;
                card.onclick = () => selectUser(user.id);
                userList.appendChild(card);
            }
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('userSelect').style.display = 'flex';
        }
        
        // 选择用户
        function selectUser(userId) {
            gameState.currentUser = userId;
            saveData();
            showMainScreen();
        }
        
        // 显示主界面
        function showMainScreen() {
            const user = gameState.users[gameState.currentUser];
            if (!user) return;
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('userSelect').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            
            // 更新头部信息
            document.getElementById('headerAvatar').textContent = user.avatar;
            document.getElementById('headerName').textContent = user.name;
            document.getElementById('totalStars').textContent = user.stars;
            document.getElementById('totalGems').textContent = user.gems;
            
            // 渲染关卡
            renderLevels();
        }
        
        // 渲染关卡
        function renderLevels() {
            const user = gameState.users[gameState.currentUser];
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            
            // 生成20个关卡
            for (let i = 1; i <= 20; i++) {
                const levelData = user.levels[i] || { completed: false, stars: 0 };
                
                const node = document.createElement('div');
                node.className = 'level-node';
                
                if (levelData.completed) {
                    node.classList.add('completed');
                } else if (i === 1 || user.levels[i-1]?.completed) {
                    node.classList.add('current');
                } else {
                    node.classList.add('locked');
                }
                
                node.innerHTML = `
                    <span class="level-number">${i}</span>
                    <span class="level-status">${levelData.completed ? '⭐'.repeat(levelData.stars) : (i === 1 || user.levels[i-1]?.completed ? '进行中' : '🔒')}</span>
                `;
                
                node.onclick = () => playLevel(i);
                grid.appendChild(node);
            }
        }
        
        // 开始关卡
        function playLevel(level) {
            showToast(`开始第 ${level} 关！`);
            // TODO: 实现关卡逻辑
        }
        
        // ==================== 初始化 ====================
        
        // 初始化
        function init() {
            loadData();
            
            // 检查是否有用户
            if (Object.keys(gameState.users).length > 0) {
                showUserSelect();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        }
        
        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
