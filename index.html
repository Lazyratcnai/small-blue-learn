<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100%; 
  overflow: hidden; 
  touch-action: manipulation;
}
body {
  font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: #1a1a2e;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app { 
  position: relative; 
  width: 100%; 
  height: 100vh; 
  overflow: hidden;
}
canvas { 
  display: block; 
  width: 100%; 
  height: 100%; 
}

/* HUD */
.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 5;
  pointer-events: none;
}
.hud-title {
  background: rgba(255,255,255,0.95);
  border-radius: 12px;
  padding: 8px 16px;
  font-size: 16px;
  font-weight: 900;
  color: #2d5a2d;
  box-shadow: 3px 3px 0 #1a3a1a;
  border: 3px solid #4a8a4a;
}
.hud-right {
  background: rgba(255,255,255,0.95);
  border-radius: 12px;
  padding: 8px 16px;
  border: 3px solid #4a8a4a;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.hud-right .n { font-size: 18px; font-weight: 900; color: #e74c3c; }
.hud-right .l { font-size: 11px; color: #666; font-weight: 700; }

/* Pixel quiz modal */
.quiz-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  padding: 16px;
}
.quiz-inner {
  background: #fef9ec;
  border-radius: 8px;
  padding: 28px 24px 24px;
  width: 100%;
  max-width: 420px;
  border: 5px solid #2d5a2d;
  box-shadow: 8px 8px 0 #1a3a1a;
  image-rendering: pixelated;
  animation: modalIn 0.15s ease;
  max-height: 90vh;
  overflow-y: auto;
}
@keyframes modalIn { from { transform: scale(0.92); } to { transform: scale(1); } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  60% { transform: translateX(8px); }
}
.quiz-inner.wrong { animation: shake 0.35s ease; }
.quiz-inner.correct { background: #e8f9ed; }

.q-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.q-cat {
  background: #c8e6c9;
  color: #2d5a2d;
  border-radius: 4px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 900;
  display: inline-block;
  border: 2px solid #4a8a4a;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.q-close {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #e74c3c;
  border: 3px solid #c0392b;
  color: white;
  font-size: 24px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 3px 3px 0 #922b3e;
  -webkit-tap-highlight-color: transparent;
}
.q-close:active { transform: scale(0.95); }

.q-word-wrap { 
  position: relative; 
  display: inline-block; 
  margin-bottom: 8px;
  width: 100%;
}
.q-word {
  font-size: 48px;
  font-weight: 900;
  color: #1a1a2e;
  line-height: 1.2;
  font-family: "Courier New", monospace;
  text-shadow: 3px 3px 0 #aaa;
  word-break: break-all;
}
.q-speak {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #3498db;
  border: 3px solid #2980b9;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: white;
  box-shadow: 3px 3px 0 #1a5276;
  -webkit-tap-highlight-color: transparent;
}
.q-speak:active { transform: translateY(-50%) scale(0.95); }

.q-chinese {
  font-size: 22px;
  font-weight: 600;
  color: #555;
  margin-bottom: 20px;
  text-align: center;
}

.q-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.q-opt {
  padding: 18px 12px;
  min-height: 64px;
  background: white;
  border: 3px solid #ddd;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 700;
  color: #333;
  cursor: pointer;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  word-break: break-all;
  line-height: 1.3;
  box-shadow: 0 4px 0 #bbb;
  -webkit-tap-highlight-color: transparent;
}
.q-opt:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #bbb;
}
.q-opt.correct {
  background: #27ae60;
  border-color: #1e8449;
  color: white;
  box-shadow: 0 4px 0 #145a32;
}
.q-opt.wrong {
  background: #e74c3c;
  border-color: #c0392b;
  color: white;
  box-shadow: 0 4px 0 #922b3e;
}

.q-progress {
  margin-top: 20px;
  text-align: center;
  font-size: 14px;
  color: #888;
  font-weight: 600;
}

/* Win modal */
.win-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 30;
  padding: 20px;
}
.win-inner {
  background: linear-gradient(180deg, #ffeaa7 0%, #fdcb6e 100%);
  border-radius: 16px;
  padding: 40px 32px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  border: 5px solid #e17055;
  box-shadow: 8px 8px 0 #d35400;
  animation: modalIn 0.2s ease;
}
.win-icon { font-size: 64px; margin-bottom: 16px; }
.win-title {
  font-size: 28px;
  font-weight: 900;
  color: #d35400;
  margin-bottom: 12px;
  text-shadow: 2px 2px 0 #fff;
}
.win-station {
  font-size: 18px;
  color: #666;
  margin-bottom: 8px;
}
.win-stats {
  font-size: 20px;
  font-weight: 800;
  color: #e74c3c;
  margin-bottom: 24px;
}
.win-btn {
  padding: 16px 40px;
  background: #27ae60;
  border: 4px solid #1e8449;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 900;
  color: white;
  cursor: pointer;
  box-shadow: 4px 4px 0 #145a32;
  -webkit-tap-highlight-color: transparent;
}
.win-btn:active { transform: translateY(3px); box-shadow: 1px 1px 0 #145a32; }

/* Footer hint */
.footer-hint {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.9);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  color: #666;
  font-weight: 600;
  border: 2px solid #ddd;
  z-index: 4;
}

/* Loading */
.loading {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #1a1a2e;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 100;
}
.loading-text {
  color: white;
  font-size: 20px;
  font-weight: 700;
  margin-top: 16px;
}
.loading-spinner {
  width: 48px;
  height: 48px;
  border: 5px solid rgba(255,255,255,0.3);
  border-top-color: #4a8a4a;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .q-word { font-size: 36px; }
  .q-opt { font-size: 16px; padding: 14px 10px; min-height: 56px; }
  .hud-title { font-size: 14px; padding: 6px 12px; }
  .hud-right .n { font-size: 16px; }
}
</style>

var CATEGORIES = [...new Set(WORDS.map(function(w) { return w.category; }))];

// ==================== GAME STATE ====================
(function() {
  var canvas = document.getElementById('map');
  var ctx = canvas.getContext('2d');
  var W, H, S;
  
  var STATE = {
    phase: 'map', // map, quiz
    station: 0,
    stations: [],
    words: [],
    wi: 0,
    correct: 0,
    mem: {}, // word id -> correct count
    totalDone: 0,
    streak: 0,
    last: '',
    tx: 0,
    cx: 0
  };
  
  // Generate station data
  var STATION_N = Math.ceil(WORDS.length / CONFIG.WORDS_PER_STATION);
  
  function buildStations() {
    STATE.stations = [];
    var gw = W * 0.08;
    var gh = H * 0.06;
    var gapX = W * 0.18;
    var startX = W * 0.15;
    var rowY = H * 0.35;
    var row2Y = H * 0.65;
    
    for (var i = 0; i < STATION_N; i++) {
      var row = i < 12 ? 0 : 1;
      var col = i < 12 ? i : i - 12;
      var x = startX + col * gapX;
      var y = row === 0 ? rowY : row2Y;
      // Alternating heights for zigzag
      if (row === 1) y += (col % 2) * (H * 0.08);
      
      STATE.stations.push({
        x: x,
        y: y,
        w: gw,
        h: gh,
        done: i < STATE.station,
        current: i === STATE.station,
        label: i + 1
      });
    }
  }
  
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    S = Math.min(W, H) * 0.012;
    canvas.width = W;
    canvas.height = H;
    buildStations();
  }
  
  function load() {
    try {
      var saved = localStorage.getItem('smallblue_v2');
      if (saved) {
        var data = JSON.parse(saved);
        STATE.station = data.station || 0;
        STATE.mem = data.mem || {};
        STATE.totalDone = data.totalDone || 0;
        STATE.streak = data.streak || 0;
        STATE.last = data.last || '';
        // Recalculate totalDone from mem
        STATE.totalDone = Object.keys(STATE.mem).filter(function(k) { return STATE.mem[k] > 0; }).length;
      }
    } catch (e) {
      console.error('Load error:', e);
    }
    STATE.tx = STATE.stations[STATE.station] ? STATE.stations[STATE.station].x : 0;
    STATE.cx = STATE.tx;
    
    // Hide loading
    document.getElementById('loading').style.display = 'none';
    updateProgress();
  }
  
  function save() {
    try {
      localStorage.setItem('smallblue_v2', JSON.stringify({
        station: STATE.station,
        mem: STATE.mem,
        totalDone: STATE.totalDone,
        streak: STATE.streak,
        last: STATE.last
      }));
    } catch (e) {
      console.error('Save error:', e);
    }
  }
  
  function updateProgress() {
    document.getElementById('progressText').textContent = STATE.totalDone + '/' + WORDS.length;
  }
  
  function speak(text) {
    if ('speechSynthesis' in window) {
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.85;
      speechSynthesis.speak(utter);
    }
  }
  
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  
  // ==================== RENDER ====================
  function render() {
    ctx.fillStyle = CONFIG.COLORS.sky;
    ctx.fillRect(0, 0, W, H);
    
    // Ground
    ctx.fillStyle = CONFIG.COLORS.grass;
    ctx.fillRect(0, H * 0.28, W, H * 0.72);
    
    // Road
    ctx.fillStyle = CONFIG.COLORS.road;
    ctx.fillRect(0, H * 0.32, W, H * 0.12);
    
    // Stations
    STATE.stations.forEach(function(st, i) {
      var color = st.done ? CONFIG.COLORS.stationDone : (st.current ? CONFIG.COLORS.stationCurrent : CONFIG.COLORS.stationLocked);
      ctx.fillStyle = color;
      // Rounded rect
      var r = 8;
      ctx.beginPath();
      ctx.roundRect(st.x - st.w/2, st.y - st.h/2, st.w, st.h, r);
      ctx.fill();
      
      // Border
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
      
      // Label
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.max(14, st.w * 0.4) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(st.label, st.x, st.y);
      
      // Star for done
      if (st.done) {
        ctx.font = Math.max(12, st.w * 0.3) + 'px Arial';
        ctx.fillText('⭐', st.x + st.w * 0.35, st.y - st.h * 0.35);
      }
    });
    
    // Player
    var px = STATE.cx;
    var py = H * 0.31;
    var playerSize = S * 2.5;
    
    ctx.fillStyle = CONFIG.COLORS.player;
    ctx.fillRect(px - playerSize/2, py - playerSize, playerSize, playerSize);
    
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(px - playerSize*0.25, py - playerSize*0.8, playerSize*0.2, playerSize*0.2);
    ctx.fillRect(px + playerSize*0.05, py - playerSize*0.8, playerSize*0.2, playerSize*0.2);
    
    // Flag at end
    var flagX = STATE.stations[STATE.stations.length - 1].x;
    var flagY = H * 0.26;
    ctx.fillStyle = '#888';
    ctx.fillRect(flagX - 3, flagY - S*4, 6, S*4);
    ctx.fillStyle = CONFIG.COLORS.flag;
    ctx.beginPath();
    ctx.moveTo(flagX + 3, flagY - S*4);
    ctx.lineTo(flagX + S*2.5, flagY - S*3);
    ctx.lineTo(flagX + 3, flagY - S*2);
    ctx.fill();
  }
  
  function loop() {
    // Smooth scroll to player
    var targetX = STATE.tx - W / 2;
    STATE.cx += (targetX - STATE.cx) * 0.1;
    
    render();
    requestAnimationFrame(loop);
  }
  
  // ==================== QUIZ ====================
  function renderQuiz() {
    var startIdx = STATE.station * CONFIG.WORDS_PER_STATION;
    var endIdx = Math.min(startIdx + CONFIG.WORDS_PER_STATION, WORDS.length);
    STATE.words = WORDS.slice(startIdx, endIdx);
    
    // Find next unwinned word
    while (STATE.wi < STATE.words.length && STATE.mem[STATE.words[STATE.wi].id] >= 3) {
      STATE.wi++;
    }
    
    if (STATE.wi >= STATE.words.length) {
      stationDone();
      return;
    }
    
    var w = STATE.words[STATE.wi];
    document.getElementById('qCat').textContent = w.category;
    document.getElementById('qWord').textContent = w.word;
    document.getElementById('qChinese').textContent = w.chinese;
    document.getElementById('qProgress').textContent = (STATE.wi + 1) + '/' + STATE.words.length;
    
    // Options
    var opts = [w.word];
    var others = shuffle(WORDS.filter(function(x) { return x.id !== w.id; }).map(function(x) { return x.word; }));
    opts = opts.concat(others.slice(0, 3));
    opts = shuffle(opts);
    
    var optsEl = document.getElementById('qOptions');
    optsEl.innerHTML = '';
    opts.forEach(function(opt) {
      var btn = document.createElement('div');
      btn.className = 'q-opt';
      btn.textContent = opt;
      btn.addEventListener('click', function() { checkAnswer(opt, w.word, btn); });
      optsEl.appendChild(btn);
    });
    
    // Auto speak
    setTimeout(function() { speak(w.word); }, 300);
  }
  
  function checkAnswer(selected, correct, btn) {
    var inner = document.getElementById('quizInner');
    inner.classList.remove('wrong', 'correct');
    
    if (selected === correct) {
      btn.classList.add('correct');
      STATE.mem[w.id] = (STATE.mem[w.id] || 0) + 1;
      if (STATE.mem[w.id] === 1) STATE.totalDone++;
      save();
      updateProgress();
      
      speak('Correct! ' + w.word);
      inner.classList.add('correct');
      
      setTimeout(function() {
        STATE.wi++;
        if (STATE.wi >= STATE.words.length) {
          stationDone();
        } else {
          renderQuiz();
        }
      }, 800);
    } else {
      btn.classList.add('wrong');
      STATE.mem[w.id] = 0;
      save();
      speak('Try again. ' + w.word);
      inner.classList.add('wrong');
      setTimeout(function() {
        inner.classList.remove('wrong');
        renderQuiz();
      }, 1300);
    }
  }
  
  function stationDone() {
    document.getElementById('quizModal').style.display = 'none';
    STATE.station++;
    
    if (STATE.station >= STATION_N) {
      var today = new Date().toDateString();
      var yesterday = new Date(Date.now() - 86400000).toDateString();
      STATE.streak = (STATE.last === yesterday) ? STATE.streak + 1 : 1;
      STATE.last = today;
      STATE.phase = 'win';
      document.getElementById('winStation').textContent = STATION_N;
      document.getElementById('winStats').textContent = STATE.totalDone + '词 · ' + STATE.streak + '天连续打卡 🔥';
      document.getElementById('winModal').style.display = 'flex';
    } else {
      STATE.stations[STATE.station].current = true;
      STATE.stations[STATE.station].done = true;
      STATE.tx = STATE.stations[STATE.station].x;
      STATE.cx = STATE.tx;
      STATE.phase = 'map';
    }
    save();
  }
  
  // ==================== EVENTS ====================
  // Click station
  canvas.addEventListener('click', function(e) {
    if (STATE.phase !== 'map') return;
    
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    
    STATE.stations.forEach(function(st, i) {
      if (i <= STATE.station && 
          x >= st.x - st.w/2 && x <= st.x + st.w/2 &&
          y >= st.y - st.h/2 && y <= st.y + st.h/2) {
        // Jump or start
        STATE.wi = 0;
        STATE.phase = 'quiz';
        document.getElementById('quizModal').style.display = 'flex';
        renderQuiz();
      }
    });
  });
  
  // Touch support for mobile
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (STATE.phase !== 'map') return;
    
    var rect = canvas.getBoundingClientRect();
    var touch = e.touches[0];
    var x = touch.clientX - rect.left;
    var y = touch.clientY - rect.top;
    
    STATE.stations.forEach(function(st, i) {
      if (i <= STATE.station && 
          x >= st.x - st.w/2 && x <= st.x + st.w/2 &&
          y >= st.y - st.h/2 && y <= st.y + st.h/2) {
        STATE.wi = 0;
        STATE.phase = 'quiz';
        document.getElementById('quizModal').style.display = 'flex';
        renderQuiz();
      }
    });
  }, { passive: false });
  
  // Win modal
  document.getElementById('winRestart').addEventListener('click', function() {
    document.getElementById('winModal').style.display = 'none';
    if (STATE.station >= STATION_N) {
      STATE.station = 0;
      for (var i = 0; i < STATE.stations.length; i++) {
        STATE.stations[i].done = false;
        STATE.stations[i].current = i === 0;
      }
      STATE.tx = STATE.stations[0].x;
      STATE.cx = STATE.tx;
    }
    STATE.phase = 'map';
  });
  
  // Quiz controls
  document.getElementById('qSpeak').addEventListener('click', function(e) {
    e.stopPropagation();
    var w = STATE.words[STATE.wi];
    if (w) speak(w.word + '. ' + w.sentence);
  });
  
  document.getElementById('qClose').addEventListener('click', function(e) {
    e.stopPropagation();
    document.getElementById('quizModal').style.display = 'none';
    STATE.phase = 'map';
  });
  
  document.getElementById('quizModal').addEventListener('click', function(e) {
    if (e.target === this) {
      this.style.display = 'none';
      STATE.phase = 'map';
    }
  });
  
  // ==================== BOOT ====================
  window.addEventListener('resize', function() { 
    resize(); 
  });
  
  window.addEventListener('load', function() {
    resize();
    load();
    buildStations();
    loop();
  });
})();
</script>
