<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小蓝学 - 魔法英语闯关</title>
    <style>
        /* 魔法学校风格 - 卡通可爱 */
        :root {
            --primary: #6B5BFF;
            --secondary: #FF6B9D;
            --accent: #FFD93D;
            --success: #4ECDC4;
            --danger: #FF6B6B;
            --dark: #2D3436;
            --light: #F8F9FA;
            --purple: #A29BFE;
            --pink: #FD79A8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .app {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 登录界面 */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #a777d3 100%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        
        @keyframes bgPulse {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .title {
            color: white;
            font-size: 36px;
            font-weight: 900;
            margin-top: 20px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            margin-top: 10px;
        }
        
        .login-form {
            width: 100%;
            max-width: 320px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            outline: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .input-group input:focus {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .btn {
            width: 100%;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #FFD93D 0%, #FF6B9D 100%);
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,107,157,0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        /* 用户选择界面 */
        .user-select {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .user-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 400px;
        }
        
        .user-card {
            width: 140px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .user-card:hover {
            transform: translateY(-5px) scale(1.05);
        }
        
        .user-avatar {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .user-level {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .add-user {
            background: rgba(255,255,255,0.3);
            border: 3px dashed rgba(255,255,255,0.6);
            color: white;
        }
        
        .add-user:hover {
            background: rgba(255,255,255,0.4);
        }
        
        /* 主界面 */
        .main-screen {
            display: none;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 50%, #90EE90 100%);
        }
        
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.2);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar-small {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .user-name-small {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.9);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .content {
            padding: 20px;
            height: calc(100% - 100px);
            overflow-y: auto;
        }
        
        /* 关卡地图 */
        .map-container {
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 20px;
            min-height: 300px;
        }
        
        .map-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            text-align: center;
        }
        
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
        }
        
        .level-node {
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            border: 4px solid #ddd;
        }
        
        .level-node:hover {
            transform: scale(1.1);
        }
        
        .level-node.completed {
            border-color: var(--success);
            background: linear-gradient(135deg, #E8F8F5, #D5F5E3);
        }
        
        .level-node.current {
            border-color: var(--accent);
            background: linear-gradient(135deg, #FEF9E7, #FCF3CF);
            animation: pulse 1.5s infinite;
        }
        
        .level-node.locked {
            opacity: 0.5;
            border-color: #ccc;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,217,61,0.5); }
            50% { box-shadow: 0 0 0 15px rgba(255,217,61,0); }
        }
        
        .level-number {
            font-size: 18px;
            font-weight: 800;
            color: var(--dark);
        }
        
        .level-status {
            font-size: 10px;
            color: #888;
        }
        
        .level-name {
            font-size: 9px;
            color: #666;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 24px;
        }
        
        /* 响应式 */
        @media (min-width: 768px) {
            .login-form {
                max-width: 400px;
            }
            
            .level-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            }
            
            .level-number {
                font-size: 24px;
            }
        }
        
        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading.active {
            display: flex;
        }
        
        /* 游戏界面 */
        .game-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        
        .game-header {
            padding: 15px 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .game-progress {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .progress-text {
            color: white;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ECDC4, #44CF6C);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .game-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            color: white;
            font-size: 16px;
        }
        
        .hp-display {
            color: #FF6B6B;
        }
        
        .question-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }
        
        .question-type {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .word-display {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .word-english {
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .word-chinese {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 15px;
        }
        
        .listen-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .listen-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.3);
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        
        .option-btn {
            background: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .option-btn:active {
            transform: scale(0.95);
        }
        
        .option-btn.correct {
            background: #4ECDC4;
            color: white;
        }
        
        .option-btn.wrong {
            background: #FF6B6B;
            color: white;
        }
        
        .match-area {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .match-words, .match-meanings {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .match-item {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 120px;
            text-align: center;
        }
        
        .match-item.selected {
            background: #6B5BFF;
            color: white;
        }
        
        .match-item.matched {
            background: #4ECDC4;
            color: white;
            opacity: 0.5;
        }
        
        .fill-area {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .fill-hint {
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .fill-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .game-footer {
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .game-timer {
            color: white;
            font-size: 18px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 2000;
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .toast.show {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 登录界面 -->
        <div class="login-screen" id="loginScreen">
            <div class="logo-container">
                <div class="logo">🧙</div>
                <h1 class="title">小蓝学</h1>
                <p class="subtitle">魔法英语闯关之旅</p>
            </div>
            <div class="login-form">
                <div class="input-group">
                    <label>请输入你的名字</label>
                    <input type="text" id="userName" placeholder="比如：Joe" maxlength="10">
                </div>
                <button class="btn btn-primary" onclick="startGame()">开始冒险 ✨</button>
            </div>
        </div>
        
        <!-- 用户选择 -->
        <div class="user-select" id="userSelect">
            <div class="logo-container">
                <div class="logo">🧙</div>
                <h1 class="title">小蓝学</h1>
                <p class="subtitle">选择你的角色</p>
            </div>
            <div class="user-list" id="userList">
                <!-- 用户列表 -->
            </div>
            <button class="btn btn-primary" style="margin-top: 30px; max-width: 200px;" onclick="showLogin()">+ 添加新角色</button>
        </div>
        
        <!-- 主界面 -->
        <div class="main-screen" id="mainScreen">
            <div class="header">
                <div class="user-info">
                    <div class="user-avatar-small" id="headerAvatar">🧙</div>
                    <span class="user-name-small" id="headerName">Joe</span>
                </div>
                <div class="stats">
                    <div class="stat-item">⭐ <span id="totalStars">0</span></div>
                    <div class="stat-item">💎 <span id="totalGems">0</span></div>
                </div>
            </div>
            
            <div class="content">
                <div class="map-container">
                    <div class="map-title">🌟 魔法关卡</div>
                    <div class="level-grid" id="levelGrid">
                        <!-- 关卡节点 -->
                    </div>
                </div>
            </div>
            
            <div class="bottom-nav">
                <div class="nav-item active">
                    <span class="nav-icon">🏠</span>
                    <span>主页</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">📚</span>
                    <span>错题本</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">🎒</span>
                    <span>背包</span>
                </div>
                <div class="nav-item">
                    <span class="nav-icon">🏆</span>
                    <span>成就</span>
                </div>
            </div>
        </div>
        
        <!-- 游戏界面 - 答题闯关 -->
        <div class="game-screen" id="gameScreen" style="display: none;">
            <!-- 顶部进度 -->
            <div class="game-header">
                <div class="game-progress">
                    <span class="progress-text">第 <span id="currentQuestion">1</span> / <span id="totalQuestions">20</span> 题</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 5%;"></div>
                    </div>
                </div>
                <div class="game-stats">
                    <span>⭐ <span id="gameStars">0</span></span>
                    <span class="hp-display">❤️ <span id="gameHP">3</span></span>
                </div>
            </div>
            
            <!-- 题目区域 -->
            <div class="question-area">
                <div class="question-type" id="questionType">看英文选中文</div>
                
                <!-- 单词显示 -->
                <div class="word-display" id="wordDisplay">
                    <div class="word-english" id="questionWord">ruler</div>
                    <div class="word-chinese" id="questionChinese">请选择中文意思</div>
                    <button class="listen-btn" id="listenBtn" onclick="playSound()">🔊 朗读</button>
                </div>
                
                <!-- 选项区域 -->
                <div class="options-grid" id="optionsGrid">
                    <!-- 选项按钮将动态生成 -->
                </div>
                
                <!-- 连连看区域 -->
                <div class="match-area" id="matchArea" style="display: none;">
                    <div class="match-words" id="matchWords"></div>
                    <div class="match-meanings" id="matchMeanings"></div>
                </div>
                
                <!-- 填空区域 -->
                <div class="fill-area" id="fillArea" style="display: none;">
                    <div class="fill-hint" id="fillHint">填写单词：rul_ _</div>
                    <input type="text" class="fill-input" id="fillInput" placeholder="请输入英文单词" maxlength="20">
                    <button class="btn btn-primary" onclick="checkFillAnswer()">确认</button>
                </div>
            </div>
            
            <!-- 底部操作 -->
            <div class="game-footer">
                <button class="btn btn-secondary" onclick="quitGame()">退出</button>
                <div class="game-timer" id="gameTimer">⏱️ 00:00</div>
            </div>
        </div>
        
        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        
        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>
    
    <script src="words.js"></script>
    <script>
        // ==================== 数据系统 ====================
        
        // 游戏数据存储key
        const STORAGE_KEY = 'smallblue_learn_data';
        
        // 游戏配置
        const CONFIG = {
            levelsPerWorld: 20,  // 每个大关的关卡数
            wordsPerLevel: 20,   // 每关单词数（实际使用词库数据）
            questionTypes: 5,   // 每关题型数
            reviewRatio: 0.2,   // 错题混入比例
            // COS配置（后续开发时从环境变量或配置服务获取，不暴露在前端）
            cosBucket: '',
            cosRegion: '',
            cosPath: ''
        };
        
        // 关卡数据（从words.js获取）
        const GAME_LEVELS = typeof LEVELS !== 'undefined' ? LEVELS : [];
        
        // 题型定义
        const QUESTION_TYPES = [
            { id: 'en2cn', name: '看英文选中文', icon: '📝' },
            { id: 'cn2en', name: '看中文选英文', icon: '🔤' },
            { id: 'listen', name: '听力选择', icon: '🔊' },
            { id: 'match', name: '连连看', icon: '🔗' },
            { id: 'fill', name: '填空题', icon: '✏️' }
        ];
        
        // 游戏状态
        let gameState = {
            currentUser: null,
            users: {},
            currentLevel: 1
        };
        
        // ==================== 存储系统 ====================
        
        // 加载数据
        function loadData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    gameState = JSON.parse(data);
                }
            } catch (e) {
                console.error('加载数据失败:', e);
            }
        }
        
        // 保存数据
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
            } catch (e) {
                console.error('保存数据失败:', e);
            }
        }
        
        // 创建新用户
        function createUser(name) {
            const userId = 'user_' + Date.now();
            gameState.users[userId] = {
                id: userId,
                name: name,
                avatar: '🧙',
                createdAt: Date.now(),
                levels: {},           // 关卡进度
                wrongWords: [],       // 错题本
                stars: 0,             // 总星星
                gems: 0,              // 钻石
                achievements: [],    // 成就
                totalWords: 0,        // 学过的总词数
                totalCorrect: 0,      // 正确总数
                lastPlay: null        // 最后游玩时间
            };
            return gameState.users[userId];
        }
        
        // ==================== 界面系统 ====================
        
        // 显示Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // 显示Loading
        function showLoading(show = true) {
            document.getElementById('loading').classList.toggle('active', show);
        }
        
        // 开始游戏
        function startGame() {
            const nameInput = document.getElementById('userName');
            const name = nameInput.value.trim();
            
            if (!name) {
                showToast('请输入你的名字');
                return;
            }
            
            // 检查是否已存在用户
            let user = null;
            for (const id in gameState.users) {
                if (gameState.users[id].name === name) {
                    user = gameState.users[id];
                    break;
                }
            }
            
            // 创建新用户
            if (!user) {
                user = createUser(name);
            }
            
            gameState.currentUser = user.id;
            saveData();
            
            showMainScreen();
        }
        
        // 显示登录界面
        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('userSelect').style.display = 'none';
            document.getElementById('userName').value = '';
        }
        
        // 显示用户选择
        function showUserSelect() {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';
            
            for (const id in gameState.users) {
                const user = gameState.users[id];
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-avatar">${user.avatar}</div>
                    <div class="user-name">${user.name}</div>
                    <div class="user-level">Lv.${Math.floor(user.totalWords / 50) + 1}</div>
                `;
                card.onclick = () => selectUser(user.id);
                userList.appendChild(card);
            }
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('userSelect').style.display = 'flex';
        }
        
        // 选择用户
        function selectUser(userId) {
            gameState.currentUser = userId;
            saveData();
            showMainScreen();
        }
        
        // 显示主界面
        function showMainScreen() {
            const user = gameState.users[gameState.currentUser];
            if (!user) return;
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('userSelect').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            
            // 更新头部信息
            document.getElementById('headerAvatar').textContent = user.avatar;
            document.getElementById('headerName').textContent = user.name;
            document.getElementById('totalStars').textContent = user.stars;
            document.getElementById('totalGems').textContent = user.gems;
            
            // 渲染关卡
            renderLevels();
        }
        
        // 渲染关卡
        function renderLevels() {
            const user = gameState.users[gameState.currentUser];
            const grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            
            // 使用词库中的关卡数量（默认32关）
            const totalLevels = GAME_LEVELS.length || 20;
            
            for (let i = 1; i <= totalLevels; i++) {
                const levelData = user.levels[i] || { completed: false, stars: 0 };
                const levelInfo = GAME_LEVELS[i - 1] || { name: `第${i}关` };
                
                const node = document.createElement('div');
                node.className = 'level-node';
                
                if (levelData.completed) {
                    node.classList.add('completed');
                } else if (i === 1 || user.levels[i-1]?.completed) {
                    node.classList.add('current');
                } else {
                    node.classList.add('locked');
                }
                
                node.innerHTML = `
                    <span class="level-number">${i}</span>
                    <span class="level-name">${levelInfo.name}</span>
                    <span class="level-status">${levelData.completed ? '⭐'.repeat(levelData.stars) : (i === 1 || user.levels[i-1]?.completed ? '进行中' : '🔒')}</span>
                `;
                
                node.onclick = () => playLevel(i);
                grid.appendChild(node);
            }
        }
        
        // ==================== 答题系统 ====================
        
        // 游戏状态
        let gameData = {
            level: 0,
            questions: [],
            currentIndex: 0,
            score: 0,
            hp: 3,
            startTime: 0,
            timerInterval: null,
            matchedPairs: []
        };
        
        // 题型定义
        const QUESTION_TYPES = [
            { id: 'en2cn', name: '看英文选中文', icon: '📝' },
            { id: 'cn2en', name: '看中文选英文', icon: '🔤' },
            { id: 'listen', name: '听力选择', icon: '🔊' },
            { id: 'match', name: '连连看', icon: '🔗' },
            { id: 'fill', name: '填空题', icon: '✏️' }
        ];
        
        // 开始关卡
        function playLevel(level) {
            const user = gameState.users[gameState.currentUser];
            const levelInfo = GAME_LEVELS[level - 1];
            let words = getLevelWords ? getLevelWords(level) : [];
            
            if (words.length === 0) {
                showToast('该关卡暂无单词数据');
                return;
            }
            
            // 混入错题（从用户错题本中取）
            const wrongWords = user.wrongWords || [];
            const reviewCount = Math.min(Math.floor(words.length * CONFIG.reviewRatio), wrongWords.length);
            
            // 随机选择一些错题混入
            if (reviewCount > 0) {
                const shuffledWrong = [...wrongWords].sort(() => Math.random() - 0.5);
                words = [...shuffledWrong.slice(0, reviewCount), ...words].slice(0, words.length + reviewCount);
            }
            
            // 打乱顺序
            words = shuffleArray([...words]);
            
            // 生成题目
            gameData = {
                level: level,
                questions: generateQuestions(words),
                currentIndex: 0,
                score: 0,
                hp: 3,
                startTime: Date.now(),
                timerInterval: null,
                matchedPairs: [],
                levelInfo: levelInfo
            };
            
            // 切换到游戏界面
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            
            // 更新UI
            document.getElementById('totalQuestions').textContent = gameData.questions.length;
            document.getElementById('gameStars').textContent = '0';
            document.getElementById('gameHP').textContent = '3';
            
            // 开始计时
            startGameTimer();
            
            // 显示第一题
            showQuestion();
            
            showToast(`开始第 ${level} 关：${levelInfo?.name || ''}`);
        }
        
        // 打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        
        // 生成题目
        function generateQuestions(words) {
            const questions = [];
            const numQuestions = Math.min(words.length, CONFIG.wordsPerLevel);
            
            for (let i = 0; i < numQuestions; i++) {
                const word = words[i];
                // 随机选择题型
                const type = QUESTION_TYPES[Math.floor(Math.random() * 2)]; // 先用前2种简单题型
                questions.push({
                    word: word,
                    type: type,
                    answered: false,
                    correct: false
                });
            }
            
            return questions;
        }
        
        // 显示题目
        function showQuestion() {
            if (gameData.currentIndex >= gameData.questions.length) {
                endGame();
                return;
            }
            
            const q = gameData.questions[gameData.currentIndex];
            const word = q.word;
            
            // 更新进度
            document.getElementById('currentQuestion').textContent = gameData.currentIndex + 1;
            document.getElementById('progressFill').style.width = 
                ((gameData.currentIndex + 1) / gameData.questions.length * 100) + '%';
            
            // 显示题型
            document.getElementById('questionType').textContent = q.type.name;
            
            // 显示单词
            document.getElementById('questionWord').textContent = word.en;
            
            // 隐藏其他区域
            document.getElementById('optionsGrid').style.display = 'none';
            document.getElementById('matchArea').style.display = 'none';
            document.getElementById('fillArea').style.display = 'none';
            document.getElementById('wordDisplay').style.display = 'block';
            
            // 根据题型生成选项
            if (q.type.id === 'en2cn') {
                showEn2CnOptions(word);
            } else if (q.type.id === 'cn2en') {
                showCn2EnOptions(word);
            } else if (q.type.id === 'fill') {
                showFillQuestion(word);
            } else {
                // 其他题型默认用选择
                showEn2CnOptions(word);
            }
        }
        
        // 看英文选中文
        function showEn2CnOptions(word) {
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            grid.style.display = 'grid';
            
            // 获取所有中文意思作为选项
            const allWords = [];
            for (const key in WORDS) {
                WORDS[key].forEach(w => {
                    if (w.en !== word.en) allWords.push(w.cn);
                });
            }
            
            // 随机选3个干扰项
            const wrongOptions = shuffleArray([...new Set(allWords)]).slice(0, 3);
            const options = shuffleArray([word.cn, ...wrongOptions]);
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === word.cn, word);
                grid.appendChild(btn);
            });
        }
        
        // 看中文选英文
        function showCn2EnOptions(word) {
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            grid.style.display = 'grid';
            
            // 获取所有英文单词作为选项
            const allWords = [];
            for (const key in WORDS) {
                WORDS[key].forEach(w => {
                    if (w.en !== word.en) allWords.push(w.en);
                });
            }
            
            // 随机选3个干扰项
            const wrongOptions = shuffleArray([...new Set(allWords)]).slice(0, 3);
            const options = shuffleArray([word.en, ...wrongOptions]);
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === word.en, word);
                grid.appendChild(btn);
            });
        }
        
        // 填空题
        function showFillQuestion(word) {
            const fillArea = document.getElementById('fillArea');
            fillArea.style.display = 'block';
            document.getElementById('wordDisplay').style.display = 'none';
            
            // 生成填空提示
            const hint = generateFillHint(word.en);
            document.getElementById('fillHint').textContent = hint;
            document.getElementById('fillInput').value = '';
            document.getElementById('fillInput').focus();
        }
        
        // 生成填空提示
        function generateFillHint(word) {
            // 隐藏中间几个字母
            const len = word.length;
            if (len <= 3) return word;
            
            const hideCount = Math.max(1, Math.floor(len / 2));
            const indices = [];
            while (indices.length < hideCount) {
                const idx = Math.floor(Math.random() * len);
                if (!indices.includes(idx) && idx !== 0 && idx !== len - 1) {
                    indices.push(idx);
                }
            }
            
            let hint = '';
            for (let i = 0; i < len; i++) {
                hint += indices.includes(i) ? '_' : word[i];
            }
            return hint;
        }
        
        // 检查填空答案
        function checkFillAnswer() {
            const input = document.getElementById('fillInput').value.trim().toLowerCase();
            const word = gameData.questions[gameData.currentIndex].word;
            checkAnswer(input === word.en.toLowerCase(), word);
        }
        
        // 检查答案
        function checkAnswer(isCorrect, word) {
            const q = gameData.questions[gameData.currentIndex];
            q.answered = true;
            q.correct = isCorrect;
            
            if (isCorrect) {
                gameData.score += 10;
                document.getElementById('gameStars').textContent = gameData.score;
                showToast('正确！+10分');
                
                // 从错题本移除（如果之前有）
                const user = gameState.users[gameState.currentUser];
                const wrongIndex = user.wrongWords.findIndex(w => w.en === word.en);
                if (wrongIndex > -1) {
                    user.wrongWords.splice(wrongIndex, 1);
                }
            } else {
                gameData.hp--;
                document.getElementById('gameHP').textContent = gameData.hp;
                showToast('错误！-1❤️');
                
                // 加入错题本
                const user = gameState.users[gameState.currentUser];
                if (!user.wrongWords) user.wrongWords = [];
                if (!user.wrongWords.find(w => w.en === word.en)) {
                    user.wrongWords.push(word);
                }
            }
            
            // 保存数据
            saveData();
            
            // 延迟进入下一题
            setTimeout(() => {
                if (gameData.hp <= 0) {
                    endGame(false);
                } else {
                    gameData.currentIndex++;
                    showQuestion();
                }
            }, 800);
        }
        
        // 播放发音
        function playSound() {
            const word = gameData.questions[gameData.currentIndex]?.word;
            if (!word) return;
            
            // 使用Web Speech API
            const utterance = new SpeechSynthesisUtterance(word.en);
            utterance.lang = 'en-GB';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }
        
        // 计时器
        function startGameTimer() {
            gameData.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameData.startTime) / 1000);
                const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const secs = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('gameTimer').textContent = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }
        
        // 结束游戏
        function endGame(victory = true) {
            clearInterval(gameData.timerInterval);
            
            const user = gameState.users[gameState.currentUser];
            const level = gameData.level;
            const score = gameData.score;
            
            // 计算星星
            const totalQuestions = gameData.questions.length;
            const correctCount = gameData.questions.filter(q => q.correct).length;
            const accuracy = correctCount / totalQuestions;
            
            let stars = 0;
            if (accuracy >= 0.9) stars = 3;
            else if (accuracy >= 0.7) stars = 2;
            else if (accuracy >= 0.5) stars = 1;
            
            // 保存关卡进度
            if (victory && stars > 0) {
                const levelData = user.levels[level] || { completed: false, stars: 0 };
                if (!levelData.completed || levelData.stars < stars) {
                    levelData.completed = true;
                    levelData.stars = stars;
                    user.levels[level] = levelData;
                    user.stars += stars;
                }
            }
            
            // 更新统计
            user.totalWords += correctCount;
            user.totalCorrect += correctCount;
            user.lastPlay = Date.now();
            
            saveData();
            
            // 显示结果
            const message = victory 
                ? `通关成功！获得 ${stars} ⭐` 
                : `游戏结束！答对 ${correctCount} 题`;
            
            showToast(message);
            
            // 延迟返回主界面
            setTimeout(() => {
                quitGame();
            }, 1500);
        }
        
        // 退出游戏
        function quitGame() {
            clearInterval(gameData.timerInterval);
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            renderLevels();
        }
        
        // ==================== 初始化 ====================
        
        // 初始化
        function init() {
            loadData();
            
            // 检查是否有用户
            if (Object.keys(gameState.users).length > 0) {
                showUserSelect();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
            }
        }
        
        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
